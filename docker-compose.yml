# Banco de dados local para desenvolvimento: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata:
